# ==================================================================================================
# Pylint Configurations for the Ktisma Package - Tests Directory
#
# File: `config/tools/pylintrc_tests.ini`
#
# Those settings apply specifically to the tests folder, to enable a more relaxed set of rules for
# testing code.
#
# Usage
# -----
# From the terminal, pass this configuration file to the Pylint linter on the tests folder:
#
# ```sh
# pylint --rcfile=config/tools/pylintrc_tests.ini tests
# ```
#
# Warning
# -------
# The Pylint extension of VS Code receives the base `pylintrc.ini` file in the VS Code settings, so
# the editor lints the tests with the base settings, not with this file.
# Module-specific sections (e.g. `[module_name.*]`) are not implemented by Pylint, and a
# configuration file does not inherit the settings of another one. To achieve per-directory
# configuration, it is necessary to use a separate, complete configuration file per directory.
# ==================================================================================================

[MESSAGES CONTROL]
disable=protected-access
; disable=unused-import,
;         missing-function-docstring,
;         missing-class-docstring,
;         no-member,
;         unused-variable,
;         protected-access,
;         redefined-outer-name
