# ==================================================================================================
# Python Semantic Release Configurations for the `ktisma` Package
#
# File: `config/tools/releaserc.toml`
#
# Usage
# -----
# From the terminal, pass this configuration file to the versioning tool:
#
# ```sh
# semantic-release --config config/tools/releaserc.toml -v version
# ```
#
# Notes
# -----
# This configuration file is used in the GitHub action `release.yml` to automate the release
# process.
#
# See Also
# --------
# [Python Semantic Release Documentation](https://python-semantic-release.readthedocs.io/en/latest/)
# ==================================================================================================

# --- General Settings -----------------------------------------------------------------------------

[semantic_release]

branch = "main"
commit_message = "release: {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
tag_format = "v{version}"
# Before 1.0.0, a breaking change bumps the minor version, and the first release may be 0.y.z.
major_on_zero = false
allow_zero_version = true

# Version sources
version_toml = ["pyproject.toml:project.version"]

# Distributions: built on the runner after the version is stamped, and uploaded to the release by
# `dist_glob_patterns`. The key `assets` would instead stage files in the release commit, so it
# names none: a built distribution never enters the repository.
build_command = "python -m pip install build && python -m build"

# --- Branch Groups --------------------------------------------------------------------------------

[semantic_release.branches.main]

match = "main"
prerelease_token = "rc"
prerelease = false

# --- Commit Message Parsing -----------------------------------------------------------------------

[semantic_release.commit_parser_options]

major_versions = ["BREAKING CHANGE"]
minor_versions = ["feat"]
patch_versions = ["fix", "perf", "refactor"]


# --- Changelog Generation -------------------------------------------------------------------------

[semantic_release.changelog]

exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]

[semantic_release.changelog.default_templates]

changelog_file = "docs/CHANGELOG.md"
output_format = "md"


# --- Remote Publishing ----------------------------------------------------------------------------

[semantic_release.remote.token]

type = "github"
env = "GH_TOKEN"

[semantic_release.publish]

dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
